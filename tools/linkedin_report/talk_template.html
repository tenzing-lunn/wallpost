<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F4F2EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Who to Talk To</title>
<style>
  :root {
    --accent: #0A66C2; --accent-pressed: #004182; --accent-tint: rgba(10,102,194,.10); --on-accent: #fff;
    --canvas: #F4F2EE; --card: #FFFFFF; --card-2: #F2F2F7; --thumb: #FFFFFF;
    --label: rgba(0,0,0,.9); --label-2: rgba(60,60,67,.62); --label-3: rgba(60,60,67,.32);
    --separator: rgba(60,60,67,.18); --fill: rgba(120,120,128,.12);
    --success: #34C759; --success-text: #057642; --success-tint: rgba(52,199,89,.14);
    --warm: #B4690E; --warm-tint: rgba(231,163,62,.16);
    --bar: rgba(244,242,238,.78); --glass: rgba(255,255,255,.72); --glass-edge: rgba(255,255,255,.6);
    --float: 0 8px 28px rgba(0,0,0,.12), 0 1px 3px rgba(0,0,0,.06);
    --card-ring: 0 0 0 .5px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
    --logo-s: 60%; --logo-bg: 92%; --logo-fg: 38%;
    --ease: cubic-bezier(.25,.1,.25,1); --spring: cubic-bezier(.32,.72,0,1); --pop: cubic-bezier(.34,1.56,.64,1);
    --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --accent: #71B7FB; --accent-pressed: #A8D4FF; --accent-tint: rgba(113,183,251,.16); --on-accent: #001A33;
      --canvas: #000000; --card: #1B1F23; --card-2: #2C2C2E; --thumb: #636366;
      --label: rgba(255,255,255,.92); --label-2: rgba(235,235,245,.6); --label-3: rgba(235,235,245,.3);
      --separator: rgba(84,84,88,.55); --fill: rgba(120,120,128,.24);
      --success: #30D158; --success-text: #30D158; --success-tint: rgba(48,209,88,.16);
      --warm: #F8C77E; --warm-tint: rgba(231,163,62,.18);
      --bar: rgba(0,0,0,.7); --glass: rgba(40,40,44,.66); --glass-edge: rgba(255,255,255,.12);
      --float: 0 8px 28px rgba(0,0,0,.5); --card-ring: 0 0 0 .5px rgba(255,255,255,.08);
      --logo-s: 45%; --logo-bg: 22%; --logo-fg: 80%;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--canvas); }
  body { margin: 0; background: var(--canvas); color: var(--label); font: 17px/22px -apple-system, system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    letter-spacing: -.43px; -webkit-font-smoothing: antialiased; touch-action: manipulation; }
  body.locked { overflow: hidden; }
  button { font: inherit; letter-spacing: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  svg.i.chev { width: 13px; height: 13px; stroke-width: 2.6; color: var(--label-3); }
  .bc { white-space: nowrap; }
  .bc.sep { margin-left: .28em; }  /* a margin, not a space: same gap whether or not the title is cut off */
  .split { display: flex; min-width: 0; white-space: nowrap; }
  .split .bt { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .split .bc { flex: none; max-width: 55%; overflow: hidden; text-overflow: ellipsis; }
  .num { font-variant-numeric: tabular-nums; }
  .one { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .app { max-width: 440px; margin: 0 auto; min-height: 100dvh; padding-bottom: calc(112px + var(--safe-b)); }
  .screen[hidden] { display: none; }

  /* Nav bar: large title collapses into a blurred bar */
  .nav { position: sticky; top: 0; z-index: 20; height: calc(44px + var(--safe-t)); padding-top: var(--safe-t);
    display: flex; align-items: center; justify-content: center; transition: background .2s var(--ease), box-shadow .2s var(--ease); }
  .nav.scrolled { background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); box-shadow: 0 .5px 0 var(--separator); }
  .nav .t { font-weight: 600; opacity: 0; transform: translateY(4px); transition: opacity .2s var(--ease), transform .2s var(--ease); }
  .nav.scrolled .t { opacity: 1; transform: none; }
  .head { padding: 2px 20px 0; }
  .eyebrow { font-size: 13px; line-height: 18px; letter-spacing: -.08px; font-weight: 600; text-transform: uppercase; color: var(--label-2); margin: 0; }
  h1 { font-size: 34px; line-height: 41px; letter-spacing: .37px; font-weight: 700; margin: 0; }
  .lede { font-size: 15px; line-height: 20px; letter-spacing: -.23px; color: var(--label-2); margin: 6px 0 0; }

  /* "Going for" line and progress row under the title */
  .goalline { display: flex; align-items: center; gap: 6px; width: 100%; min-height: 44px; padding: 0 20px; margin-top: 2px; font-size: 15px; letter-spacing: -.23px; text-align: left; }
  .goalline .k { color: var(--label-2); flex: none; }
  .goalline .v { color: var(--accent); font-weight: 500; min-width: 0; }
  .goalline svg.i.chev { color: var(--accent); width: 11px; height: 11px; }
  .week { display: flex; align-items: center; gap: 12px; margin: 4px 20px 0; padding: 12px 0 2px; border-top: .5px solid var(--separator); }
  .week .t { font-size: 15px; letter-spacing: -.23px; color: var(--label-2); }
  .week .t b { color: var(--label); font-weight: 600; }
  .pips { display: flex; gap: 6px; margin-left: auto; }
  .pip { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--fill); color: transparent; transition: background .35s var(--ease); }
  .pip svg.i { width: 14px; height: 14px; stroke-width: 2.8; }
  .pip.on { background: var(--success); color: #fff; }
  .pip.on.fresh { animation: pop .45s var(--pop); }
  @keyframes pop { from { transform: scale(.4); } to { transform: scale(1); } }

  .section { margin: 28px 16px 0; }
  .sh { padding: 0 4px 8px; }
  .sh h2 { font-size: 22px; line-height: 28px; letter-spacing: .35px; font-weight: 700; margin: 0; }
  .card { background: var(--card); border-radius: 16px; box-shadow: var(--card-ring); }
  .press { transition: transform .25s var(--ease); }
  .press:active { transform: scale(.98); transition-duration: .1s; }

  /* Avatars and logos */
  .av { --h: 210; flex: none; width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; position: relative;
    font-weight: 600; font-size: 17px; letter-spacing: 0; color: #fff; background: linear-gradient(145deg, hsl(var(--h) 62% 58%), hsl(calc(var(--h) + 25) 58% 44%)); }
  .av.xl { width: 72px; height: 72px; font-size: 26px; }
  .av.l { width: 56px; height: 56px; font-size: 20px; }
  .av.s { width: 40px; height: 40px; font-size: 15px; }
  .av .ok { position: absolute; right: -2px; bottom: -2px; width: 20px; height: 20px; border-radius: 50%; background: var(--success); color: #fff;
    display: grid; place-items: center; box-shadow: 0 0 0 2px var(--card); }
  .av .ok svg.i { width: 12px; height: 12px; stroke-width: 3; }
  .av.s .ok { width: 16px; height: 16px; right: -3px; bottom: -3px; }
  .av.s .ok svg.i { width: 10px; height: 10px; }
  .logo { --h: 210; flex: none; width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; font-size: 17px; letter-spacing: 0;
    color: hsl(var(--h) var(--logo-s) var(--logo-fg)); background: hsl(var(--h) var(--logo-s) var(--logo-bg)); }
  .logo.s { width: 40px; height: 40px; border-radius: 9px; font-size: 16px; }

  /* Hero */
  .hero { padding: 18px 20px 6px; margin: 16px 16px 0; }
  .tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; color: var(--accent); }
  .tag svg.i { width: 14px; height: 14px; stroke-width: 2.2; }
  .who { display: flex; align-items: center; gap: 14px; margin-top: 14px; }
  .who > div { min-width: 0; }
  .who .n { font-size: 22px; line-height: 28px; font-weight: 700; letter-spacing: .35px; }
  .who .r { font-size: 15px; line-height: 20px; color: var(--label-2); letter-spacing: -.23px; margin-top: 2px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .who .r b { color: var(--label); font-weight: 500; }
  .why { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 10px; }
  .why li { display: flex; align-items: center; gap: 10px; font-size: 15px; line-height: 20px; letter-spacing: -.23px; }
  .why .ic { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--accent-tint); color: var(--accent); flex: none; }
  .why .ic svg.i { width: 16px; height: 16px; stroke-width: 2; }
  .why li.warm .ic { background: var(--warm-tint); color: var(--warm); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 10px; border-radius: 999px; font-size: 13px; letter-spacing: -.08px; font-weight: 500;
    background: var(--fill); color: var(--label-2); }
  .chip svg.i { width: 14px; height: 14px; stroke-width: 2.1; color: var(--accent); }
  .chip.warm svg.i { color: var(--warm); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 50px; padding: 0 18px; border-radius: 999px; white-space: nowrap;
    font-size: 17px; font-weight: 600; letter-spacing: -.43px; width: 100%; transition: transform .25s var(--ease), background .2s var(--ease), opacity .2s; }
  .btn:active { transform: scale(.97); transition-duration: .1s; }
  .btn svg.i { width: 20px; height: 20px; stroke-width: 2; }
  .btn.primary { background: var(--accent); color: var(--on-accent); }
  .btn.primary:active { background: var(--accent-pressed); }
  .btn.tinted { background: var(--accent-tint); color: var(--accent); }
  .btn.green { background: var(--success); color: #fff; }
  .btn.plain { background: var(--fill); color: var(--label); }
  .pill { display: inline-flex; align-items: center; justify-content: center; height: 32px; padding: 0 14px; border-radius: 999px; font-size: 15px; font-weight: 600;
    letter-spacing: -.23px; background: var(--accent-tint); color: var(--accent); }
  .pill svg.i { width: 16px; height: 16px; stroke-width: 2.2; display: none; }
  .hero .btn.primary { margin-top: 20px; }
  .subrow { display: flex; justify-content: center; }
  .link { font-size: 15px; letter-spacing: -.23px; color: var(--accent); padding: 0 12px; min-height: 44px; }
  .link.muted { color: var(--label-2); }

  /* Grouped list of compact people */
  .list { overflow: hidden; }
  .mini { display: flex; align-items: center; gap: 12px; padding: 12px 14px 12px 16px; width: 100%; text-align: left; position: relative; min-height: 72px; }
  .mini + .mini::before, .row + .row::before { content: ""; position: absolute; top: 0; right: 0; height: .5px; background: var(--separator); }
  .mini + .mini::before { left: 76px; }
  .mini:active, .row:active { background: var(--fill); }
  .mini .body, .row .body { flex: 1; min-width: 0; }
  .mini .n { font-size: 17px; font-weight: 600; }
  .mini .r { font-size: 15px; line-height: 20px; color: var(--label-2); letter-spacing: -.23px; }
  .mini .hint { display: flex; align-items: center; gap: 5px; margin-top: 3px; font-size: 13px; line-height: 18px; letter-spacing: -.08px; color: var(--accent); }
  .mini .hint svg.i { width: 13px; height: 13px; stroke-width: 2.2; }
  .mini .hint span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mini .hint.warm { color: var(--warm); }
  .mini.done .n { color: var(--label-2); }
  .mini .cta { flex: none; }
  .sent { font-size: 15px; font-weight: 600; color: var(--success-text); display: inline-flex; align-items: center; gap: 4px; }
  .sent svg.i { width: 16px; height: 16px; stroke-width: 2.6; }
  @media (max-width: 359px) { .mini .pill { width: 36px; height: 36px; padding: 0; font-size: 0; } .mini .pill svg.i { display: block; } }

  /* Celebration */
  .celebrate { padding: 28px 20px 22px; margin: 16px 16px 0; text-align: center; }
  .celebrate h3 { font-size: 22px; line-height: 28px; margin: 16px 0 4px; letter-spacing: .35px; }
  .celebrate p { margin: 0 0 18px; color: var(--label-2); font-size: 15px; line-height: 20px; letter-spacing: -.23px; }
  .celebrate p:last-child { margin-bottom: 0; }

  /* Ring */
  .ring { display: block; margin: 0 auto; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-linecap: round; }
  .ring .track { stroke: var(--accent-tint); }
  .ring .bar { stroke: var(--accent); transition: stroke-dashoffset 1s cubic-bezier(.65,0,.35,1); }
  .ring.green .track { stroke: var(--success-tint); }
  .ring.green .bar { stroke: var(--success); }
  .ringwrap { position: relative; width: max-content; margin: 0 auto; }
  .ringwrap .mid { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .ringwrap .big { font-size: 44px; line-height: 48px; font-weight: 700; letter-spacing: -.5px; }
  .ringwrap .of { font-size: 13px; color: var(--label-2); letter-spacing: -.08px; font-weight: 500; }
  .ringwrap .bigcheck { color: var(--success); display: grid; }
  .ringwrap .bigcheck svg.i { width: 56px; height: 56px; stroke-width: 3; }

  /* Companies */
  .cover { padding: 24px 20px 20px; margin: 16px 16px 0; text-align: center; }
  .cover p { font-size: 17px; line-height: 22px; margin: 16px auto 0; max-width: 300px; }
  .cover small { display: block; margin-top: 6px; font-size: 15px; line-height: 20px; color: var(--label-2); letter-spacing: -.23px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px 6px; padding: 18px 10px; }
  .co { display: grid; justify-items: center; align-content: start; gap: 6px; text-align: center; min-width: 0; }
  .co .nm { font-size: 11px; line-height: 13px; letter-spacing: .06px; color: var(--label-2); max-width: 80px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: normal; word-break: normal; hyphens: none; }
  .co .logo { position: relative; width: 52px; height: 52px; border-radius: 13px; font-size: 20px; background: var(--fill); color: var(--label-3); }
  .co .nm.word { display: block; white-space: nowrap; text-overflow: ellipsis; }
  .co .lk { position: absolute; bottom: -4px; right: -4px; width: 20px; height: 20px; border-radius: 50%; background: var(--card); color: var(--label-3); display: grid; place-items: center; box-shadow: 0 0 0 .5px var(--separator); }
  .co .lk svg.i { width: 11px; height: 11px; stroke-width: 2.4; }
  .more { display: block; width: 100%; min-height: 44px; font-size: 15px; color: var(--accent); border-top: .5px solid var(--separator); letter-spacing: -.23px; }
  .loop { display: flex; gap: 12px; align-items: flex-start; padding: 16px; margin: 12px 16px 0; font-size: 15px; line-height: 20px; letter-spacing: -.23px; color: var(--label-2); }
  .loop svg.i { color: var(--accent); margin-top: -1px; }

  /* Inset grouped rows */
  .row { display: flex; align-items: center; gap: 12px; padding: 10px 14px 10px 16px; width: 100%; text-align: left; min-height: 64px; position: relative; }
  .row + .row::before { left: 68px; }
  .list.ranked .row + .row::before { left: 100px; }
  .row .n { font-size: 17px; line-height: 22px; }
  .row .r { font-size: 15px; line-height: 20px; letter-spacing: -.23px; color: var(--label-2); }
  .row .rk { width: 20px; font-size: 13px; color: var(--label-3); text-align: right; flex: none; font-weight: 600; letter-spacing: 0; }
  .step { align-items: flex-start; padding-top: 14px; padding-bottom: 14px; }
  .step .ic { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-tint); color: var(--accent); flex: none; }
  .step .n { font-weight: 600; }
  .step .r { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin-top: 1px; }
  .step svg.i.chev { align-self: center; }
  .unhide { flex: none; font-size: 15px; color: var(--accent); min-height: 44px; padding: 0 4px; }
  .foot { font-size: 13px; line-height: 18px; letter-spacing: -.08px; color: var(--label-2); padding: 8px 16px 0; margin: 0; }
  .gh { font-size: 13px; line-height: 18px; letter-spacing: -.08px; color: var(--label-2); text-transform: uppercase; padding: 0 16px 7px; margin: 0; }
  .search { display: flex; align-items: center; gap: 6px; height: 36px; margin: 14px 16px 0; padding: 0 8px; border-radius: 10px; background: var(--fill); color: var(--label-2); }
  .search svg.i { width: 18px; height: 18px; }
  .search input { flex: 1; min-width: 0; border: 0; background: none; font: inherit; color: var(--label); outline: none; }
  .search input::placeholder { color: var(--label-2); }
  .seg { display: grid; grid-template-columns: 1fr 1fr; margin: 12px 16px 0; padding: 2px; border-radius: 9px; background: var(--fill); position: relative; height: 32px; }
  .seg .thumb { position: absolute; top: 2px; bottom: 2px; left: 2px; width: calc(50% - 2px); border-radius: 7px; background: var(--thumb);
    box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 3px 1px rgba(0,0,0,.04); transition: transform .25s var(--spring); }
  .seg[data-i="1"] .thumb { transform: translateX(100%); }
  .seg button { position: relative; z-index: 1; font-size: 13px; font-weight: 600; letter-spacing: -.08px; }
  .empty { padding: 28px 20px; text-align: center; color: var(--label-2); font-size: 15px; }

  /* Tab bar: floating glass capsule */
  .tabs { position: fixed; z-index: 30; left: 50%; bottom: calc(10px + var(--safe-b)); transform: translateX(-50%); width: min(360px, calc(100% - 32px));
    display: grid; grid-template-columns: repeat(3, 1fr); padding: 6px; border-radius: 999px;
    background: var(--glass); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
    box-shadow: var(--float), inset 0 0 0 .5px var(--glass-edge); }
  .tab { display: grid; justify-items: center; gap: 2px; padding: 6px 0 5px; border-radius: 999px; color: var(--label-2); font-size: 10px; line-height: 12px; letter-spacing: .1px; font-weight: 600; }
  .tab svg.i { width: 24px; height: 24px; }
  .tab[aria-current="page"] { color: var(--accent); background: var(--accent-tint); }

  /* Sheet */
  .scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.28); opacity: 0; pointer-events: none; transition: opacity .35s var(--ease); }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; z-index: 41; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 440px; max-height: calc(100dvh - var(--safe-t) - 12px);
    background: var(--card); border-radius: 28px 28px 0 0; box-shadow: 0 -2px 20px rgba(0,0,0,.15); display: flex; flex-direction: column;
    transform: translateY(105%); visibility: hidden; transition: transform .48s var(--spring), visibility 0s .48s; }
  .sheet:focus { outline: none; }
  .sheet.on { transform: none; visibility: visible; transition: transform .48s var(--spring), visibility 0s 0s; }
  .sheet .grab { flex: none; height: 22px; display: grid; place-items: center; touch-action: none; cursor: grab; }
  .sheet .grab::before { content: ""; width: 36px; height: 5px; border-radius: 3px; background: var(--label-3); }
  .sheet .sb { overflow-y: auto; padding: 0 20px calc(20px + var(--safe-b)); overscroll-behavior: contain; }
  .sheet .top { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; margin: -4px -8px 8px; }
  .sheet .top h3 { margin: 0; font-size: 17px; font-weight: 600; text-align: center; grid-column: 2; }
  .x { grid-column: 3; width: 44px; height: 44px; display: grid; place-items: center; color: var(--label-2); }
  .x span { width: 30px; height: 30px; border-radius: 50%; background: var(--fill); display: grid; place-items: center; }
  .x svg.i { width: 13px; height: 13px; stroke-width: 2.8; }
  .sheet .who { margin-top: 0; }
  .sheet .who .n a:active { opacity: .6; }
  .msg { margin-top: 20px; }
  .msg label { display: block; font-size: 13px; line-height: 18px; letter-spacing: -.08px; color: var(--label-2); text-transform: uppercase; padding: 0 4px 7px; }
  textarea { display: block; width: 100%; font: inherit; font-size: 17px; line-height: 23px; letter-spacing: -.43px; color: var(--label); background: var(--card-2);
    border: 0; border-radius: 14px; padding: 14px 16px; resize: none; outline: none; min-height: 120px; max-height: 38vh; overflow-y: auto; }
  textarea:focus { box-shadow: 0 0 0 2px var(--accent); }
  @media (max-height: 700px) {  /* small phones: keep the send button on screen while the draft scrolls */
    .sheet .stack { position: sticky; bottom: calc(-20px - var(--safe-b)); background: var(--card); padding: 12px 0 calc(20px + var(--safe-b));
      margin-bottom: calc(-20px - var(--safe-b)); box-shadow: 0 -.5px 0 var(--separator); }
    textarea { max-height: 30vh; }
  }
  .tip { font-size: 13px; line-height: 18px; letter-spacing: -.08px; color: var(--label-2); padding: 7px 4px 0; margin: 0; }
  .stack { display: grid; gap: 10px; margin-top: 18px; }

<script>
const DATA = __DATA__;
const LABEL = Object.fromEntries(DATA.tracks.map(t => [t.key, t.label]));
const WANT = { swe: "software engineering internships", quant: "quant internships", ai: "AI/ML internships",
  markets: "markets and investing internships", startups: "early-stage startups" };
const WORK = { engineering: "engineering", research: "research", quant: "quant/trading", data: "data science",
  finance: "finance", founder_exec: "founder", product: "product", business: "business", education: "teaching" };
const REAL = new Set(["firm", "startup", "research_org"]);
const MARKETS = new Set(["banking_markets", "investment_vc", "quant_trading"]);
let session = {};  // corrections, goals and progress made on this page
try { session = JSON.parse(localStorage.getItem("talk-session") || "{}"); } catch {}
const keep = () => { try { localStorage.setItem("talk-session", JSON.stringify(session)); } catch {} };
const goals = new Set(session.goals || DATA.tracks.filter(t => t.count > 0).map(t => t.key));
const marked = new Set(Object.keys(session).filter(k => k.startsWith("done:")).map(k => k.slice(5)));
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const animated = new Set();  // numbers and rings animate once, not on every render
let ranked = [], people = [];

// A week starts Monday. A new week starts a new batch; anyone not yet messaged carries over.
// Checked again whenever the app comes back to the foreground: iOS can keep a home-screen app open for days.
const weekNow = () => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (d.getDay() + 6) % 7);
  return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };
let WEEK = weekNow();
function rollWeek() {
  WEEK = weekNow();
  if (session.week === WEEK) return false;
  session.week = WEEK; session.batch = (session.batch || []).filter(u => !marked.has(u)); keep();
  return true;
}
rollWeek();
const sentThisWeek = () => session["sent:" + WEEK] || 0;

const ICON = {
  work: '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/>',
  saved: '<path d="M6 3h12v18l-6-4-6 4z"/>',
  follow: '<path d="M12 3.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.8l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/>',
  hires: '<path d="M4 21V5l8-2v18M12 8h8v13M2 21h20"/>',
  shared: '<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/>',
  note: '<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',
  inbound: '<path d="M17 7L7 17M7 9v8h8"/>',
  recent: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  send: '<path d="M21 3L10 14M21 3l-7 18-4-7-7-4z"/>',
  copy: '<rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',
  open: '<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
  chev: '<path d="M9 5l7 7-7 7"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  star: '<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>',
  bulb: '<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/>',
  people: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c1.8.7 3 2.4 3.5 5.2"/>',
};
function icon(name, cls = "") {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("class", ("i " + cls).trim()); s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("aria-hidden", "true");
  s.innerHTML = ICON[name];
  return s;
}
const chev = () => icon("chev", "chev");

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v; else if (k.startsWith("on")) e[k] = v; else if (k === "style") e.style.cssText = v; else e.setAttribute(k, v);
  }
  for (const k of kids) if (k != null && k !== false) e.append(k);
  return e;
}

const HUES = [211, 232, 258, 282, 318, 350, 12, 28, 190];  // no greens: green means "sent"
const hash = s => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 9973, 7);
const initials = name => name.split(/\s+/).map(w => (w.match(/\p{L}/u) || [""])[0]).filter(Boolean).slice(0, 2).join("").toUpperCase();
function avatar(p, size = "") {
  return el("span", { class: "av " + size, style: `--h:${HUES[hash(p.name) % HUES.length]}`, "aria-hidden": "true" }, initials(p.name),
    marked.has(p.url) ? el("span", { class: "ok" }, icon("check")) : null);
}
function logo(name, cls = "") {
  const letter = (name.replace(/^the\s+/i, "").match(/[\p{L}0-9]/u) || ["?"])[0].toUpperCase();
  return el("span", { class: "logo " + cls, style: `--h:${190 + hash(name) % 140}`, "aria-hidden": "true" }, letter);
}
const byline = p => [p.position, p.company].filter(Boolean).join(" · ") || "No title listed";
// Title, then company kept whole: wraps or truncates the title first, never strands the "·".
const bylineEl = (p, cls = "r") => el("div", { class: cls }, p.position ? el("span", { class: "bt" }, p.position.trim()) : null,
  p.company ? el("span", { class: p.position ? "bc sep" : "bc" }, (p.position ? "· " : "") + p.company) : null, !p.position && !p.company ? "No title listed" : null);
const listOf = xs => xs.length < 2 ? xs.join("") : xs.slice(0, -1).join(", ") + (xs.length > 2 ? "," : "") + " or " + xs[xs.length - 1];

// Apply this session's corrections on top of the engine's judgments.
function view(p) {
  // A low-confidence AI label counts as "couldn't judge", never as a fact.
  const guess = x => x.source === "claude" && x.confidence === "low";
  const org = { ...p.org, ...(guess(p.org) ? { kind: "unknown" } : {}), ...(session["org:" + p.orgKey] || {}) };
  const role = { ...p.role, ...(guess(p.role) ? { function: "unknown" } : {}), ...(session["title:" + p.titleKey] || {}) };
  return { ...p, org, role, hidden: session["person:" + p.url] ?? !!p.hidden };
}

function tracksOf(p) {
  const { function: f, domains } = p.role, t = new Set();
  if (f === "engineering") { t.add("swe"); if (domains.includes("ai")) t.add("ai"); }
  if ((f === "research" || f === "data") && (domains.includes("ai") || p.org.industry === "ai" || f === "data")) t.add("ai");
  if (f === "quant") t.add("quant");
  if (f === "finance" && MARKETS.has(p.org.industry)) t.add("markets");
  if (f === "founder_exec" && p.org.kind === "startup") t.add("startups");
  return [...t];
}

function score(p) {
  if (!goals.size) return { p, tracks: [], score: 0 };
  const real = REAL.has(p.org.kind) || (p.org.kind === "school" && p.role.function === "research"
    && !["intern", "student"].includes(p.role.seniority));
  const tracks = real ? tracksOf(p).filter(t => goals.has(t)) : [];
  let fit = 0;
  // Inside a firm that hires interns for one of your goals (open listings data).
  const hiring = !p.target && p.org.hires.some(t => goals.has(t));
  if (tracks.length) fit = p.target === "saved" ? 3 : p.target === "follow" ? 2.5 : hiring ? 2.5 : 2;
  else if (p.target && real) fit = p.target === "saved" ? 1.5 : 1;
  if (!fit) return { p, tracks, score: 0 };
  const level = { leader: 0.7, founder: 0.85, senior: 0.9 }[p.role.seniority] || 1;
  const warm = (p.shared ? 1.5 : 0) + (p.note ? 1 : 0) + (p.theyInvited ? 0.5 : 0) + (p.days != null && p.days <= 90 ? 0.5 : 0);
  return { p, tracks, score: fit * level * (1 + warm / 4) };
}
const rankOf = p => ranked.find(r => r.p.url === p.url) || score(p);

// Why this person: [icon, text, warm?], strongest first.
function reasons({ p, tracks }) {
  const out = [];
  if (tracks.length) out.push(["work", `Does ${WORK[p.role.function] || p.role.function} work${p.role.domains.includes("ai") && p.role.function !== "research" ? " in AI" : ""}`]);
  if (p.target === "saved") out.push(["saved", `You saved a job at ${p.company}`]);
  if (p.target === "follow") out.push(["follow", `You follow ${p.company}`]);
  if (!p.target && tracks.length && p.org.hires.some(t => goals.has(t))) out.push(["hires", `${p.company} hires interns in your field`]);
  if (p.shared) out.push(["shared", `${p.shared}, like you`, true]);
  if (p.note) out.push(["note", p.theyInvited ? "Wrote you a note when connecting" : "You wrote them a note", true]);
  else if (p.theyInvited) out.push(["inbound", "They reached out to you first", true]);
  if (p.days != null && p.days <= 90) out.push(["recent", p.days < 14 ? "Connected in the last 2 weeks" : "Connected recently", true]);
  return out;
}
const whyList = (r, max = 9) => el("ul", { class: "why" }, ...reasons(r).slice(0, max).map(([ic, t, w]) =>
  el("li", { class: w ? "warm" : "" }, el("span", { class: "ic" }, icon(ic)), t)));
const whyChips = r => el("div", { class: "chips" }, ...reasons(r).map(([ic, t, w]) => el("span", { class: "chip" + (w ? " warm" : "") }, icon(ic), t)));

function opener({ p, tracks }, introFor) {
  const school = DATA.school || "college";
  const intro = p.shared === DATA.school ? `fellow ${school} student here.`
    : p.shared ? `I noticed we're both part of the ${p.shared} community. I'm a student at ${school}.`
    : `I'm a student at ${school}.`;
  const want = tracks.length ? WANT[tracks[0]] : `opportunities at ${p.company}`;
  const saw = p.position ? `your role as ${p.position}${p.company ? " at " + p.company : ""}` : `that you're at ${p.company}`;
  if (introFor) return `Hi ${p.first}, ${intro} I'm looking at ${want}, and I saw ${saw}. I'm also trying to learn more about ${listOf(introFor)}. Do you happen to know anyone there who'd be open to a quick chat? No pressure at all if not.`;
  return `Hi ${p.first}, ${intro} I'm looking at ${want}, and I saw ${saw}. I'd love to hear how you got there and what you'd focus on in my position. Would you be open to a quick 15-minute call in the next couple of weeks?`;
}

async function save(type, key, value) {
  try { await fetch("/correct", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ type, key, value }) }); }
  catch { /* opened as a file: the fix still applies here via localStorage */ }
}

/* ---------- motion helpers ---------- */

function fixSheet(r) {

    session[sessionKey] = val; keep(); save(type, key, value); closeSheet(); render();

    const undo = () => {

  const guideUrls = new Set(DATA.tracks.map(t => session["guide:" + t.key]).filter(x => x?.week === WEEK).map(x => x.url));
  for (const r of ranked) {

    if (!marked.has(u) && !b.includes(u) && session["asked:" + u] !== WEEK && !guideUrls.has(u)) b.push(u);

  if (steps.length) nodes.push(el("div", { class: "section" }, el("p", { class: "gh" }, "Your next way in"), el("div", { class: "card list" }, ...steps)));

  const showAll = !!host.dataset.all, shown = showAll ? open : open.slice(0, 8);
  if (open.length) nodes.push(el("div", { class: "section" }, el("p", { class: "gh" }, `No way in yet · ${open.length}`),
    el("div", { class: "card" }, el("div", { class: "grid" }, ...shown.map(t => el("div", { class: "co", title: t.name },
        el("span", { style: "position:relative" }, logo(t.name), el("span", { class: "lk" }, icon("lock"))), el("span", { class: "nm" + (/\s/.test(t.name.trim()) ? "" : " word") }, t.name)))),
      open.length > 8 ? el("button", { class: "more", onclick: () => { showAll ? delete host.dataset.all : host.dataset.all = "1"; renderTargets(); } },
        showAll ? "Show less" : `Show all ${open.length}`) : null)));
  nodes.push(el("div", { class: "card loop" }, icon("people"),
    el("span", {}, `When classmates join, we'll check their connections for the other ${open.length} companies and tell you who can introduce you.`)));
  host.replaceChildren(...nodes);
}

let segI = 0;
function renderAll() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const unsure = people.filter(p => !ranked.some(r => r.p === p) && (p.org.kind === "unknown" || p.role.function === "unknown")
    && (p.role.domains.length || ["engineering", "research", "quant", "data", "finance", "founder_exec"].includes(p.role.function)));
  const seg = document.getElementById("seg"); seg.dataset.i = segI;
  const [a, b] = seg.querySelectorAll("button");
  a.textContent = `Ranked · ${ranked.length}`; b.textContent = `Couldn't judge · ${unsure.length}`;
  a.setAttribute("aria-pressed", String(segI === 0)); b.setAttribute("aria-pressed", String(segI === 1));
  const match = p => !q || [p.name, p.company, p.position].some(s => s.toLowerCase().includes(q));
  const rows = (segI === 0 ? ranked : unsure.map(p => ({ p, tracks: [], score: 0 }))).filter(r => match(r.p));
  const row = (r, i) => el("button", { class: "row", onclick: () => personSheet(r) },
    segI === 0 ? el("span", { class: "rk num" }, i + 1) : null, avatar(r.p, "s"),
    el("div", { class: "body" }, el("div", { class: "n one" }, r.p.name), bylineEl(r.p, "r split")), chev());
  const nodes = [rows.length ? el("div", { class: "section", style: "margin-top:16px" },
      el("div", { class: "card list" + (segI === 0 ? " ranked" : "") }, ...rows.map(row)),
      el("p", { class: "foot" }, segI === 0 ? `Out of your ${DATA.total} connections, these do the work you're going for, or work where you're aiming.`
        : "We couldn't tell what these companies or roles are, so they aren't ranked. Tap one to fix it if you know."))
    : el("p", { class: "empty" }, q ? `No one matches “${q}”` : "Nothing here.")];
  const hidden = DATA.people.map(view).filter(p => p.hidden && match(p));
  if (segI === 0 && hidden.length) nodes.push(el("div", { class: "section" }, el("p", { class: "gh" }, `Hidden · ${hidden.length}`),
    el("div", { class: "card list" }, ...hidden.map(p => el("div", { class: "row" }, avatar(p, "s"),
      el("div", { class: "body" }, el("div", { class: "n one" }, p.name), bylineEl(p, "r split")),
      el("button", { class: "unhide", onclick: () => { session["person:" + p.url] = false; keep(); save("undo", p.url, { kind: "person" }); render(); toast(`${p.first} is back`); } }, "Unhide"))))));
  document.getElementById("all").replaceChildren(...nodes);
}
document.getElementById("q").oninput = renderAll;
document.querySelectorAll("#seg button").forEach(b => b.onclick = () => { segI = +b.dataset.i; renderAll(); });

function render() {
  people = DATA.people.map(view).filter(p => !p.hidden);
  ranked = people.map(score).filter(r => r.score > 0).sort((a, b) => b.score - a.score);
  renderGoalLine(); renderToday(); renderTargets(); renderAll();
  observeNavs();
}

/* ---------- tabs + collapsing nav ---------- */
const scrollPos = {};
let tab = "today";
function showTab(name) {
  scrollPos[tab] = scrollY; tab = name;
  document.querySelectorAll(".tab").forEach(x => x.dataset.tab === name ? x.setAttribute("aria-current", "page") : x.removeAttribute("aria-current"));
  document.querySelectorAll(".screen").forEach(s => s.hidden = s.id !== "s-" + name);
  scrollTo(0, scrollPos[name] || 0);
  observeNavs();
}
document.querySelectorAll(".tab").forEach(t => t.onclick = () =>
  t.dataset.tab === tab ? scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" }) : showTab(t.dataset.tab));
// The small title shows once the large title has slid under the bar, as in iOS.
function observeNavs() {
  const scr = document.getElementById("s-" + tab), nav = scr.querySelector(".nav");
  nav.classList.toggle("scrolled", scr.querySelector("h1").getBoundingClientRect().bottom <= nav.offsetHeight);
}
let navFrame = 0;
addEventListener("scroll", () => { cancelAnimationFrame(navFrame); navFrame = requestAnimationFrame(observeNavs); }, { passive: true });
function setDate() { document.getElementById("date").textContent = new Date().toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" }); }
setDate();
document.getElementById("goalline").onclick = goalSheet;

/* ---------- first-run recap ---------- */
function intro() {
  const box = document.getElementById("intro"), active = DATA.tracks.filter(t => goals.has(t.key));
  const saved = DATA.targets.filter(t => t.kind === "saved");
  const orgs = new Set(people.map(p => p.orgKey));
  const covered = saved.filter(t => orgs.has(t.key)).length;
  const best = ranked[0];
  const n = (to, key, suffix) => { const s = el("span", { class: "num" }); countUp(s, to, key, 1100); return el("div", { class: "hn" }, s, suffix || null); };
  const cards = [
    () => [el("div", { class: "k" }, "Your network"), n(DATA.total, "i0"), el("h2", {}, "connections, read one by one."),
      el("p", {}, "We looked at what each person does and where, to find who can actually help with what you want.")],
    () => [el("div", { class: "k" }, "Doing what you want"), n(ranked.length, "i1"), el("h2", {}, ranked.length === 1 ? "of them is doing the work you're going for." : "of them are doing the work you're going for."),
      el("div", { class: "chips" }, ...active.map(t => el("span", {}, t.label))),
      el("p", {}, "Everyone else is still worth knowing. Just not for this.")],
    () => [el("div", { class: "k" }, "Your target companies"), n(covered, "i2", el("small", {}, ` / ${saved.length}`)),
      el("h2", {}, covered ? "You already know someone inside." : "No one inside yet. That's normal."),
      el("div", { class: "dots" }, ...saved.slice(0, 30).map((t, i) => el("i", { class: i < covered ? "on" : "" }))),
      el("p", {}, "These are the companies where you saved jobs. Each person you talk to can open more of them.")],
    ...(best ? [() => [el("div", { class: "k" }, "Start here"), el("h2", { style: "margin-top:18px" }, `Your best way in is ${best.p.first}.`),
      el("div", { class: "who", style: "margin-top:26px" }, avatar(best.p, "xl"), el("div", {},
        el("div", { class: "n" }, best.p.name), bylineEl(best.p))),
      whyList(best, 3)]] : []),
  ];
  let i = 0;
  const finish = () => {
    try { localStorage.setItem("talk-intro-seen", "1"); } catch {}
    removeEventListener("keydown", keys);
    box.style.transition = "opacity .35s"; box.style.opacity = "0";
    setTimeout(() => { box.hidden = true; box.style.opacity = ""; document.body.classList.remove("locked"); shell.forEach(n => n.inert = false); }, reduce ? 0 : 350);
  };
  const go = d => { const j = i + d; if (j >= 0 && j < cards.length) { i = j; show(); } };
  const show = () => {
    const last = i === cards.length - 1;
    const stage = el("div", { class: "stage", "aria-live": "polite", tabindex: "-1" }, el("div", { class: "rise" }, ...cards[i]()));
    const bottom = el("div", { class: "bottom" }, last
      ? el("button", { class: "btn white", onclick: e => { e.stopPropagation(); finish(); } }, best ? "See who to talk to this week" : "Pick your goals")
      : el("button", { class: "next", onclick: e => { e.stopPropagation(); go(1); } }, "Tap to continue"));
    box.replaceChildren(...[el("div", { class: "bars", "aria-hidden": "true" }, ...cards.map((_, j) => el("i", { class: j <= i ? "on" : "" }))),
      !last && el("button", { class: "skip", onclick: e => { e.stopPropagation(); finish(); } }, "Skip"), stage, bottom].filter(Boolean));
    stage.focus({ preventScroll: true });
  };
  const keys = e => {
    if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); go(1); }
    else if (e.key === "ArrowLeft") go(-1);
    else if (e.key === "Escape") finish();
  };
  box.onclick = e => go(i > 0 && e.clientX < innerWidth / 3 ? -1 : 1);
  ["i0", "i1", "i2"].forEach(k => animated.delete(k));
  addEventListener("keydown", keys);
  box.hidden = false; document.body.classList.add("locked"); shell.forEach(n => n.inert = true); show();
}
document.getElementById("replay").onclick = intro;
document.getElementById("to-all").onclick = () => showTab("all");

render();
let seen = false;
try { seen = !!localStorage.getItem("talk-intro-seen"); } catch {}
if (!seen) intro(); else askIfPending();
</script>
</body>
</html>
